name: Voorraad bijwerken

on:
  schedule:
    - cron: "10 6,9,12,15,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: voorraad
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install beautifulsoup4==4.12.3 pillow==10.4.0
      - run: python update.py
      - name: Wijzigingen opslaan
        run: |
          git config user.name "Slim zoeken (automatisch)"
          git config user.email "actions@users.noreply.github.com"
          git add index.html fotos.json
          git diff --cached --quiet && echo "Geen wijzigingen" && exit 0
          git commit -m "Voorraad bijgewerkt $(TZ=Europe/Amsterdam date '+%d-%m-%Y %H:%M')"
          git push
